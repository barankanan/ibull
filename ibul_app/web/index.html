  <!-- CanvasKit varyantı flutter.js ile AYNI kural: Blink + ImageDecoder +

        ? 'canvaskit/chromium/'
        : 'canvaskit/';
      function addHint(rel, href, asValue) {
        var link = document.createElement('link');
        link.rel = rel;
        link.href = href;
        if (asValue) link.as = asValue;
        link.crossOrigin = 'anonymous';
        if (asValue === 'fetch') link.setAttribute('fetchpriority', 'high');
        document.head.appendChild(link);

      addHint('modulepreload', base + 'canvaskit.js');
      addHint('preload', base + 'canvaskit.wasm', 'fetch');
    })();

  <div id="ibul-boot-error" role="alert" aria-live="assertive">
    <h1>Uygulama başlatılamadı</h1>
    <p id="ibul-boot-error-msg">Bir yükleme hatası oluştu. Sayfayı yenileyin veya destek ile iletişime geçin.</p>
    <button type="button" onclick="window.location.reload()">Sayfayı Yenile</button>
  </div>

  <script>
    (function () {
      var bootStartedAt = Date.now();
      try {
        localStorage.setItem('ibul_web_perf_trace_v1', JSON.stringify({
          stage: 'app_script_started',
          elapsedMs: 0,
          total_boot_elapsed_ms: 0,
          timestamp: new Date().toISOString()
        }));
      } catch (_) {}
      if (window.performance && performance.mark) {
        performance.mark('ibul_html_shell_visible');
        performance.mark('ibul_flutter_boot_start');
      }

      window.__ibulShowBootError = function (message) {
        var loader = document.getElementById('ibul-loader');
        if (loader) loader.style.display = 'none';
        var panel = document.getElementById('ibul-boot-error');
        var msg = document.getElementById('ibul-boot-error-msg');
        if (msg && message) msg.textContent = message;
        if (panel) panel.classList.add('visible');
      };

      window.__ibulHomeBootStartedAt = bootStartedAt;
      var bootAttemptId = 'boot_' + bootStartedAt;
      window.__ibulHomeBootWatchdogId = null;

      try {
        localStorage.removeItem('ibul_web_boot_trace_v1');
      } catch (_) {}

      window.__ibulHomeBootTrace = {
        bootAttemptId: bootAttemptId,
        module: 'home_screen',
        stage: 'app_script_started',
        retryCount: 0,
        lastError: null,
        moduleLoaded: false,
        factoryCompleted: false,
        firstFrameRendered: false,
        bootComplete: false
      };

      // Watchdog iptali; `bootWatchdogCancelled` bayrağı, watchdog henüz
      // KURULMADAN iptal edilirse (hızlı açılış) gecikmeli kurulumun da
      // atlanmasını sağlar.
      var bootWatchdogCancelled = false;
      window.__ibulCancelHomeBootWatchdog = function () {
        bootWatchdogCancelled = true;
        if (window.__ibulHomeBootWatchdogId != null) {
          clearInterval(window.__ibulHomeBootWatchdogId);
          window.__ibulHomeBootWatchdogId = null;
        }
      };

      function isBootTerminalStage(stage, patch) {
        if (patch && patch.bootComplete === true) return true;
        return (
          stage === 'completed' ||
          stage === 'boot_complete' ||
          stage === 'home_core_first_frame_rendered' ||
          stage === 'homescreen_first_frame_rendered' ||
          stage === 'timeout_triggered' ||
          stage === 'error_caught'
        );
      }

      window.__ibulUpdateHomeBootTrace = function (patch) {
        if (!window.__ibulHomeBootTrace) return;
        var next = Object.assign({}, window.__ibulHomeBootTrace, patch || {});
        if (patch && patch.bootAttemptId) {
          next.bootAttemptId = patch.bootAttemptId;
        } else if (!next.bootAttemptId) {
          next.bootAttemptId = bootAttemptId;
        }
        window.__ibulHomeBootTrace = next;
        var elapsed = Math.floor((Date.now() - window.__ibulHomeBootStartedAt) / 1000);
        var payload = Object.assign({}, next, {
          elapsedSeconds: elapsed,
          timestamp: new Date().toISOString(),
          userAgent: navigator.userAgent
        });
        try {
          localStorage.setItem('ibul_web_boot_trace_v1', JSON.stringify(payload));
        } catch (_) {}
        if (isBootTerminalStage(next.stage, patch)) {
          window.__ibulCancelHomeBootWatchdog();
        }
      };

      // ── Watchdog gecikmeli kurulur ────────────────────────────────────────
      // Bu interval her tick'te Object.assign ×2 + JSON.stringify + SENKRON
      // localStorage.setItem yapıyor; eskiden boot'un ilk saniyesinden itibaren
      // çalışıyor ve ana thread'i tam da kritik pencerede meşgul ediyordu.
      // Normal açılışta Dart terminal stage'e ulaşıp `__ibulCancelHomeBoot-
      // Watchdog`u çağırdığı için watchdog artık hiç kurulmaz. Yavaş/başarısız
      // açılışta (2 sn+) aynen eskisi gibi devreye girer — 90 sn'lik tanılama
      // ve hata ekranı davranışı birebir korunur.
      function startBootWatchdog() {
        if (bootWatchdogCancelled || window.__ibulHomeBootWatchdogId != null) return;
        if (isBootTerminalStage(
              window.__ibulHomeBootTrace && window.__ibulHomeBootTrace.stage,
              window.__ibulHomeBootTrace)) {
          return;
        }
        window.__ibulHomeBootWatchdogId = window.setInterval(watchdogTick, 1000);
      }

      function watchdogTick() {
        if (!window.__ibulHomeBootTrace) return;
        var stage = window.__ibulHomeBootTrace.stage;
        if (isBootTerminalStage(stage, window.__ibulHomeBootTrace)) {
          window.__ibulCancelHomeBootWatchdog();
          return;
        }
        if (document.querySelector('flt-glass-pane') &&
            !window.__ibulHomeBootTrace.bootComplete &&
            !isBootTerminalStage(stage, window.__ibulHomeBootTrace)) {
          window.__ibulUpdateHomeBootTrace({
            stage: 'flutter_runtime_detected',
            bootComplete: true,
            firstFrameRendered: true
          });
          return;
        }
        window.__ibulUpdateHomeBootTrace({});
        var elapsed = Math.floor((Date.now() - window.__ibulHomeBootStartedAt) / 1000);
        if (elapsed >= 90) {
          if (document.querySelector('flt-glass-pane')) {
            window.__ibulUpdateHomeBootTrace({
              stage: 'flutter_runtime_detected',
              bootComplete: true,
              firstFrameRendered: true
            });
            return;
          }
          window.__ibulUpdateHomeBootTrace({
            stage: 'timeout_triggered',
            globalErrorReason: 'HTML watchdog: home boot exceeded 90s at stage ' + stage,
            lastError: 'HTML watchdog: home boot exceeded 90s at stage ' + stage
          });
          window.__ibulShowBootError(
            'Ana sayfa modülü yüklenemedi (' + stage + ', ' + elapsed + 's). Sayfayı yenileyin.'
          );
        }
      }

      window.setTimeout(startBootWatchdog, 2000);

      // ── Hata ekranı YALNIZ boot penceresinde gösterilir ─────────────────
      // Flutter bir kez çizdikten sonra herhangi bir geç hata (flaky ağ
      // üzerinden düşen deferred part, tek bir bölümün başarısız fetch'i, geç
      // gelen bir promise rejection) tüm ÇALIŞAN uygulamayı tam ekran
      // "başlatılamadı" paneliyle değiştiriyordu. Hata artık her durumda
      // kaydediliyor (maskelenmiyor), ama takeover yalnız runtime henüz
      // ayakta değilken yapılıyor.
      function isFlutterRuntimeUp() {
        if (window.__ibulHomeBootTrace && window.__ibulHomeBootTrace.bootComplete) {
          return true;
        }
        if (document.querySelector('flt-glass-pane')) return true;
        // Dart ilk usable frame'den sonra #ibul-loader'ı DOM'dan siliyor.
        return document.getElementById('ibul-loader') === null;
      }

      function recordBootError(module, message) {
        try {
          localStorage.setItem('ibul_web_boot_error_v1', JSON.stringify({
            module: module,
            message: message,
            at: new Date().toISOString()
          }));
        } catch (_) {}
      }

      // Entry bundle deploy'da `app.<hash>.js` olarak parmak izlenir; eski
      // filtre yalnız `main.dart.js` arıyordu, yani GERÇEK boot hataları hiç
      // raporlanmıyor, buna karşılık zararsız geç hatalar raporlanıyordu.
      function isAppScript(file) {
        if (!file) return false;
        return (
          file.indexOf('main.dart.js') >= 0 ||
          file.indexOf('canvaskit') >= 0 ||
          file.indexOf('flutter_bootstrap') >= 0 ||
          file.indexOf('.part.js') >= 0 ||
          /(^|\/)app\.[0-9a-f]{8,}\.js(\?|$)/.test(file)
        );
      }

      window.addEventListener('error', function (event) {
        if (!event || !event.message) return;
        var file = event.filename || '';
        if (!isAppScript(file)) return;
        recordBootError(file || 'window.onerror', event.message);
        if (isFlutterRuntimeUp()) return;
        window.__ibulShowBootError(
          'Uygulama kodu yüklenemedi: ' + event.message
        );
      });

      window.addEventListener('unhandledrejection', function (event) {
        if (!event) return;
        var reason = event.reason;
        var text = reason && reason.message ? reason.message : String(reason || 'unknown');
        if (
          /sponsoredLists|recentProducts|LazySection|section timeout|HomePerf/i.test(text)
        ) {
          if (event.preventDefault) event.preventDefault();
          return;
        }
        recordBootError('unhandledrejection', text);
        if (isFlutterRuntimeUp()) return;
        window.__ibulShowBootError(
          'Uygulama başlatılamadı: ' + text
        );
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) {
            var url = reg.active && reg.active.scriptURL ? reg.active.scriptURL : '';
            if (url.indexOf('flutter_service_worker') >= 0) {
              reg.unregister();
            }
          });
        });
      }

      // Aşağıdaki 60 sn'lik zaman aşımı gerçek bir başarısız-boot güvenliği.
      window.setTimeout(function () {
        if (document.getElementById('ibul-loader') &&
            !document.querySelector('flt-glass-pane') &&
            !(window.__ibulHomeBootTrace && window.__ibulHomeBootTrace.bootComplete)) {
          window.__ibulShowBootError(
            'Uygulama yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin. ' +
              '(60 sn içinde başlamadı — önbelleği temizleyip tekrar deneyin.)'
          );
        }
      }, 60000);
    })();
  </script>

  <script src="flutter_bootstrap.js" defer></script>
