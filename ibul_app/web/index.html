  <!-- CanvasKit, Roboto fallback fontunu çalışma anında fonts.gstatic.com'dan
       indiriyor (derlenmiş main.dart.js içinde https://fonts.gstatic.com/s/
       referansı mevcut; CSP font-src zaten bu origin'e izin veriyor).
       Preconnect DNS + TCP + TLS'i motor fontu istemeden önce hazırlar.
       crossorigin zorunlu: font isteği CORS modunda gider, aksi hâlde açılan
       bağlantı yeniden kullanılamaz. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://ihmixxzqnpamcwmrfibx.supabase.co" crossorigin>

  <!-- flutter_bootstrap.js kritik zincirin ilk halkası; script etiketi
       body'nin en sonunda olduğu için parser oraya varana kadar fetch
       başlamıyordu. Preload ile inline script parse edilirken paralel
       indiriliyor, etikete gelindiğinde preload cache'ten okunur ve ikinci
       istek oluşmaz. -->
  <link rel="preload" href="flutter_bootstrap.js" as="script" fetchpriority="high">
  <link rel="preload" href="main.dart.js" as="script" fetchpriority="high">

  <!-- CanvasKit varyantı flutter.js ile AYNI kural: Blink + ImageDecoder +
       v8BreakIterator ise chromium/, aksi hâlde tam canvaskit/.
       Yanlış dosyayı preload etmek 2.5 MB israf + bant yarışı yapıyordu;
       doğru varyant main.dart.js ile paralel iner. -->
  <script>
    (function preloadCanvasKitVariant() {
      var ua = navigator.userAgent || '';
      var isBlink = navigator.vendor === 'Google Inc.' || ua.indexOf('Edg/') >= 0;
      var hasImageCodecs = typeof ImageDecoder !== 'undefined' && isBlink;
      var hasChromiumBreakIterators =
        typeof Intl.v8BreakIterator !== 'undefined' &&
        typeof Intl.Segmenter !== 'undefined';
      var base = (hasImageCodecs && hasChromiumBreakIterators)
        ? 'canvaskit/chromium/'
        : 'canvaskit/';
      function addHint(rel, href, asValue) {
        var link = document.createElement('link');
        link.rel = rel;
        link.href = href;
        if (asValue) link.as = asValue;
        link.crossOrigin = 'anonymous';
        if (asValue === 'fetch') link.setAttribute('fetchpriority', 'high');
        document.head.appendChild(link);
      }
      addHint('modulepreload', base + 'canvaskit.js');
      addHint('preload', base + 'canvaskit.wasm', 'fetch');
    })();
  </script>


  <style>
    html, body { margin: 0; padding: 0; background: #F9FAFB; }
    /* Masaüstü: gerçek header iskeleti (WebHeader ile aynı renk/ölçü).
       Flutter ilk frame'de #ibul-loader'ı anında siler — fade yok. */
    #ibul-loader {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; flex-direction: column; align-items: stretch;
      background: #F9FAFB;
    }
    #ibul-web-chrome { display: none; background: #fff; }
    @media (min-width: 1100px) {
      #ibul-web-chrome { display: block; }
    }
    .ibul-top {
      max-width: 1400px; margin: 0 auto; padding: 12px 24px;
      display: flex; align-items: center; gap: 32px;
    }
    .ibul-brand { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .ibul-brand img { width: 32px; height: 32px; border-radius: 12px; }
    .ibul-brand span {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 28px; font-weight: 900; color: #7A2FF4; letter-spacing: -0.5px;
    }
    .ibul-search {
      flex: 1; height: 48px; border: 1px solid rgba(122,47,244,0.35);
      border-radius: 12px; display: flex; align-items: center; padding: 0 16px;
      color: #9e9e9e; font: 14px/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .ibul-cats {
      border-top: 1px solid #eee; border-bottom: 1px solid #eee;
      padding: 14px 24px 0; overflow: hidden; white-space: nowrap;
      font: 600 13px/40px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #333;
    }
    .ibul-cats span { margin-right: 22px; }
    .ibul-skel { max-width: 1400px; margin: 16px auto; padding: 0 24px; }
    .ibul-skel i {
      display: block; background: #eee; border-radius: 12px; margin-bottom: 12px;
    }
    #ibul-loader-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px; color: #666; letter-spacing: 0.2px;
      max-width: 420px; text-align: center; line-height: 1.5; padding: 48px 16px 0;
      margin: 0 auto;
    }
    #ibul-boot-error {
      display: none;
      position: fixed; inset: 0; z-index: 100000;
      background: #fff; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #ibul-boot-error.visible { display: flex; flex-direction: column; }
    #ibul-boot-error h1 { font-size: 22px; margin: 0 0 12px; color: #111; }
    #ibul-boot-error p { font-size: 15px; color: #666; max-width: 480px; line-height: 1.5; margin: 0 0 20px; }
    #ibul-boot-error button {
      background: #7B2FBE; color: #fff; border: none; border-radius: 10px;
      padding: 12px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Metin bilerek BOŞ: hızlı açılışta (ilk frame < 300ms) kullanıcı hiçbir
       yazı görmez, yalnız beyaz ekran görür. "Yükleniyor…" sadece 300ms'i
       aşan yavaş açılışlarda aşağıdaki tek setTimeout ile yazılır. -->
  <div id="ibul-loader" aria-live="polite" aria-busy="true">
    <div id="ibul-web-chrome">
      <div class="ibul-top">
        <div class="ibul-brand">
          <img src="assets/icons/ibul_logo_2.png" alt="" width="32" height="32">
          <span>iBul</span>
        </div>
        <div class="ibul-search">Ürün, kategori veya marka ara...</div>
      </div>
      <div class="ibul-cats">
        <span>Yakın Lokasyon</span><span>Erkek</span><span>Kadın</span><span>Elektronik</span><span>Ayakkabı &amp; Çanta</span><span>Saat &amp; Aksesuar</span><span>Ev &amp; Yaşam</span>
      </div>
      <div class="ibul-skel">
        <i style="height:72px"></i>
        <i style="height:160px"></i>
        <i style="height:220px"></i>
      </div>
    </div>
    <div id="ibul-loader-text"></div>
  </div>
  <div id="ibul-boot-error" role="alert" aria-live="assertive">
    <h1>Uygulama başlatılamadı</h1>
    <p id="ibul-boot-error-msg">Bir yükleme hatası oluştu. Sayfayı yenileyin veya destek ile iletişime geçin.</p>
    <button type="button" onclick="window.location.reload()">Sayfayı Yenile</button>
  </div>

  <script>
    (function () {
      var bootStartedAt = Date.now();
      try {
        localStorage.setItem('ibul_web_perf_trace_v1', JSON.stringify({
          stage: 'app_script_started',
          elapsedMs: 0,
          total_boot_elapsed_ms: 0,
          timestamp: new Date().toISOString()
        }));
      } catch (_) {}
      var loaderText = document.getElementById('ibul-loader-text');

      function setLoaderMessage(message) {
        if (loaderText) loaderText.textContent = message;
      }

      // ── Geç-görünen "Yükleniyor…" ─────────────────────────────────────────
      // Tek amaç: iyi bağlantıda kullanıcının HİÇBİR yükleme metni görmemesi.
      // İlk frame 300ms'ten önce gelirse loader DOM'dan silinmiş olur ve bu
      // callback hiçbir şey yazmaz. Yalnız gerçekten yavaş açılışta ortada
      // sade bir yazı belirir — ikon/spinner/animasyon yok.
      window.setTimeout(function () {
        if (!document.getElementById('ibul-loader')) return;
        if (window.matchMedia && window.matchMedia('(min-width: 1100px)').matches) return;
        setLoaderMessage('Yükleniyor…');
      }, 300);

      window.__ibulShowBootError = function (message) {
        var loader = document.getElementById('ibul-loader');
        if (loader) loader.style.display = 'none';
        var panel = document.getElementById('ibul-boot-error');
        var msg = document.getElementById('ibul-boot-error-msg');
        if (msg && message) msg.textContent = message;
        if (panel) panel.classList.add('visible');
      };

      window.__ibulHomeBootStartedAt = bootStartedAt;
      var bootAttemptId = 'boot_' + bootStartedAt;
      window.__ibulHomeBootWatchdogId = null;

      try {
        localStorage.removeItem('ibul_web_boot_trace_v1');
      } catch (_) {}

      window.__ibulHomeBootTrace = {
        bootAttemptId: bootAttemptId,
        module: 'home_screen',
        stage: 'app_script_started',
        retryCount: 0,
        lastError: null,
        moduleLoaded: false,
        factoryCompleted: false,
        firstFrameRendered: false,
        bootComplete: false
      };

      // Watchdog iptali; `bootWatchdogCancelled` bayrağı, watchdog henüz
      // KURULMADAN iptal edilirse (hızlı açılış) gecikmeli kurulumun da
      // atlanmasını sağlar.
      var bootWatchdogCancelled = false;
      window.__ibulCancelHomeBootWatchdog = function () {
        bootWatchdogCancelled = true;
        if (window.__ibulHomeBootWatchdogId != null) {
          clearInterval(window.__ibulHomeBootWatchdogId);
          window.__ibulHomeBootWatchdogId = null;
        }
      };

      function isBootTerminalStage(stage, patch) {
        if (patch && patch.bootComplete === true) return true;
        return (
          stage === 'completed' ||
          stage === 'boot_complete' ||
          stage === 'home_core_first_frame_rendered' ||
          stage === 'homescreen_first_frame_rendered' ||
          stage === 'timeout_triggered' ||
          stage === 'error_caught'
        );
      }

      window.__ibulUpdateHomeBootTrace = function (patch) {
        if (!window.__ibulHomeBootTrace) return;
        var next = Object.assign({}, window.__ibulHomeBootTrace, patch || {});
        if (patch && patch.bootAttemptId) {
          next.bootAttemptId = patch.bootAttemptId;
        } else if (!next.bootAttemptId) {
          next.bootAttemptId = bootAttemptId;
        }
        window.__ibulHomeBootTrace = next;
        var elapsed = Math.floor((Date.now() - window.__ibulHomeBootStartedAt) / 1000);
        var payload = Object.assign({}, next, {
          elapsedSeconds: elapsed,
          timestamp: new Date().toISOString(),
          userAgent: navigator.userAgent
        });
        try {
          localStorage.setItem('ibul_web_boot_trace_v1', JSON.stringify(payload));
        } catch (_) {}
        if (isBootTerminalStage(next.stage, patch)) {
          window.__ibulCancelHomeBootWatchdog();
        }
      };

      // ── Watchdog gecikmeli kurulur ────────────────────────────────────────
      // Bu interval her tick'te Object.assign ×2 + JSON.stringify + SENKRON
      // localStorage.setItem yapıyor; eskiden boot'un ilk saniyesinden itibaren
      // çalışıyor ve ana thread'i tam da kritik pencerede meşgul ediyordu.
      // Normal açılışta Dart terminal stage'e ulaşıp `__ibulCancelHomeBoot-
      // Watchdog`u çağırdığı için watchdog artık hiç kurulmaz. Yavaş/başarısız
      // açılışta (2 sn+) aynen eskisi gibi devreye girer — 90 sn'lik tanılama
      // ve hata ekranı davranışı birebir korunur.
      function startBootWatchdog() {
        if (bootWatchdogCancelled || window.__ibulHomeBootWatchdogId != null) return;
        if (isBootTerminalStage(
              window.__ibulHomeBootTrace && window.__ibulHomeBootTrace.stage,
              window.__ibulHomeBootTrace)) {
          return;
        }
        window.__ibulHomeBootWatchdogId = window.setInterval(watchdogTick, 1000);
      }

      function watchdogTick() {
        if (!window.__ibulHomeBootTrace) return;
        var stage = window.__ibulHomeBootTrace.stage;
        if (isBootTerminalStage(stage, window.__ibulHomeBootTrace)) {
          window.__ibulCancelHomeBootWatchdog();
          return;
        }
        if (document.querySelector('flt-glass-pane') &&
            !window.__ibulHomeBootTrace.bootComplete &&
            !isBootTerminalStage(stage, window.__ibulHomeBootTrace)) {
          window.__ibulUpdateHomeBootTrace({
            stage: 'flutter_runtime_detected',
            bootComplete: true,
            firstFrameRendered: true
          });
          return;
        }
        window.__ibulUpdateHomeBootTrace({});
        var elapsed = Math.floor((Date.now() - window.__ibulHomeBootStartedAt) / 1000);
        if (elapsed >= 90) {
          if (document.querySelector('flt-glass-pane')) {
            window.__ibulUpdateHomeBootTrace({
              stage: 'flutter_runtime_detected',
              bootComplete: true,
              firstFrameRendered: true
            });
            return;
          }
          window.__ibulUpdateHomeBootTrace({
            stage: 'timeout_triggered',
            globalErrorReason: 'HTML watchdog: home boot exceeded 90s at stage ' + stage,
            lastError: 'HTML watchdog: home boot exceeded 90s at stage ' + stage
          });
          window.__ibulShowBootError(
            'Ana sayfa modülü yüklenemedi (' + stage + ', ' + elapsed + 's). Sayfayı yenileyin.'
          );
        }
      }

      window.setTimeout(startBootWatchdog, 2000);

      window.addEventListener('error', function (event) {
        if (!event || !event.message) return;
        var file = event.filename || '';
        if (
          file.indexOf('main.dart.js') >= 0 ||
          file.indexOf('canvaskit') >= 0 ||
          file.indexOf('flutter_bootstrap') >= 0 ||
          file.indexOf('.part.js') >= 0
        ) {
          try {
            localStorage.setItem('ibul_web_boot_error_v1', JSON.stringify({
              module: file || 'window.onerror',
              message: event.message,
              at: new Date().toISOString()
            }));
          } catch (_) {}
          window.__ibulShowBootError(
            'Uygulama kodu yüklenemedi: ' + event.message
          );
        }
      });

      window.addEventListener('unhandledrejection', function (event) {
        if (!event) return;
        var reason = event.reason;
        var text = reason && reason.message ? reason.message : String(reason || 'unknown');
        if (
          /sponsoredLists|recentProducts|LazySection|section timeout|HomePerf/i.test(text)
        ) {
          if (event.preventDefault) event.preventDefault();
          return;
        }
        try {
          localStorage.setItem('ibul_web_boot_error_v1', JSON.stringify({
            module: 'unhandledrejection',
            message: text,
            at: new Date().toISOString()
          }));
        } catch (_) {}
        window.__ibulShowBootError(
          'Uygulama başlatılamadı: ' + text
        );
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) {
            var url = reg.active && reg.active.scriptURL ? reg.active.scriptURL : '';
            if (url.indexOf('flutter_service_worker') >= 0) {
              reg.unregister();
            }
          });
        });
      }

      // NOT: "Uygulama dosyaları indiriliyor…" / "Uygulama motoru
      // başlatılıyor…" / "Hâlâ yükleniyor…" sahte ilerleme mesajlarını basan
      // 1 sn'lik progressTimer tamamen kaldırıldı. Splash artık tek bir metin
      // durumu biliyor: 300ms'i aşan açılışlarda sade "Yükleniyor…".
      // Aşağıdaki 60 sn'lik ağ gerçek bir başarısız-boot güvenliği; splash
      // gecikmesi değil, dokunulmadı.
      window.setTimeout(function () {
        if (document.getElementById('ibul-loader') &&
            !document.querySelector('flt-glass-pane') &&
            !(window.__ibulHomeBootTrace && window.__ibulHomeBootTrace.bootComplete)) {
          window.__ibulShowBootError(
            'Uygulama yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin. ' +
              '(60 sn içinde başlamadı — önbelleği temizleyip tekrar deneyin.)'
          );
        }
      }, 60000);
    })();
  </script>

  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
