# Root analyzer stays at flutter_lints defaults on purpose.
# Kod Dilim 3: empty_catches / avoid_print are errors only in new-code
# directories that include tool/analysis_options_new_code.yaml
# (checkout, investor, ihiz, coming_soon, legal, seller cargo).
# Do not promote those rules here — seller_panel, product_model, and the
# print stack still have hundreds of empty catches and debugPrints.

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule
