<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="İbul ile teknoloji, market ve daha birçok kategoride online alışveriş yapın; hızlı teslimat avantajını yakalayın.">
  <meta name="keywords" content="ibul, online alışveriş, e-ticaret, hızlı teslimat, ihız, satıcı paneli">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="İbul">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:title" content="İbul | Online Alışveriş ve Hızlı Teslimat">
  <meta property="og:description" content="İbul ile teknoloji, market ve daha birçok kategoride online alışveriş yapın; hızlı teslimat avantajını yakalayın.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="İbul | Online Alışveriş ve Hızlı Teslimat">
  <meta name="twitter:description" content="İbul ile teknoloji, market ve daha birçok kategoride online alışveriş yapın; hızlı teslimat avantajını yakalayın.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="İbul">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>İbul | Online Alışveriş ve Hızlı Teslimat</title>
  <link rel="manifest" href="manifest.json">

  <!-- ── Performance: preconnect to Supabase & CDN ── -->
  <!-- Supabase hostname is injected at build-time via --dart-define so we
       cannot hard-code it here; add it in your CDN / edge configuration. -->

  <!-- ── Preloader — shown immediately, dismissed when Flutter canvas appears ── -->
  <!-- IMPORTANT: <style> and <div> must be inside <head> for earliest possible paint. -->
  <style>
    /* Reset body so preloader fills the whole viewport */
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #ibul-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #ibul-loader.fade-out { opacity: 0; pointer-events: none; }
    #ibul-loader-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px; color: #888; letter-spacing: 0.2px;
    }
    #ibul-boot-error {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: #fff;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #ibul-boot-error.visible { display: flex; flex-direction: column; }
    #ibul-boot-error h1 { font-size: 22px; margin: 0 0 12px; color: #111; }
    #ibul-boot-error p { font-size: 15px; color: #666; max-width: 480px; line-height: 1.5; margin: 0 0 20px; }
    #ibul-boot-error button {
      background: #7B2FBE; color: #fff; border: none; border-radius: 10px;
      padding: 12px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
  </style>
  <div id="ibul-loader">
    <div id="ibul-loader-text">
      <!-- Show "QR kod okunuyor…" for /qr paths, generic otherwise -->
    </div>
  </div>
  <div id="ibul-boot-error" role="alert" aria-live="assertive">
    <h1>Uygulama başlatılamadı</h1>
    <p id="ibul-boot-error-msg">Bir yükleme hatası oluştu. Sayfayı yenileyin veya destek ile iletişime geçin.</p>
    <button type="button" onclick="window.location.reload()">Sayfayı Yenile</button>
  </div>

  <script>
    console.log('[WebBoot][start]');
    window.__ibulShowBootError = function (message) {
      console.error('[WebBoot][fatal_error]', message || 'unknown');
      var loader = document.getElementById('ibul-loader');
      if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
      var panel = document.getElementById('ibul-boot-error');
      var msg = document.getElementById('ibul-boot-error-msg');
      if (msg && message) msg.textContent = message;
      if (panel) panel.classList.add('visible');
    };
    window.addEventListener('error', function (event) {
      if (event && event.message) {
        console.error('[WebBoot][window_error]', event.message);
      }
    });
    window.addEventListener('unhandledrejection', function (event) {
      console.error('[WebBoot][unhandled_rejection]', event.reason);
    });
    // ── Timing: HTML loader became visible ─────────────────────────────────
    var _ibulT0 = performance.now();
    console.log('[IBL-Timing] HTML loader visible at t=' + _ibulT0.toFixed(1) + 'ms (navigationStart-relative)');
    (function() {
      var path = window.location.pathname;
      var isQr = path === '/qr' || path.startsWith('/qr?') ||
                 window.location.search.indexOf('table_qr=') !== -1;
      var loaderText = document.getElementById('ibul-loader-text');
      if (loaderText) {
        loaderText.textContent = isQr ? 'QR kod okunuyor…' : 'Yükleniyor…';
      }
    })();

    // ── Dismiss preloader when Flutter inserts its canvas ─────────────────
    (function () {
      var observer = new MutationObserver(function () {
        if (document.querySelector('flt-glass-pane')) {
          observer.disconnect();
          var elapsed = (performance.now() - _ibulT0).toFixed(1);
          console.log('[IBL-Timing] Flutter first frame (flt-glass-pane) at +' + elapsed + 'ms from loader');
          var el = document.getElementById('ibul-loader');
          if (el) {
            el.classList.add('fade-out');
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 350);
          }
        }
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
      // Safety net: show error UI if Flutter never starts
      setTimeout(function () {
        if (document.querySelector('flt-glass-pane')) return;
        observer.disconnect();
        window.__ibulShowBootError(
          'Uygulama yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.'
        );
        console.warn('[IBL-Timing] Preloader safety-net — Flutter may not have started.');
      }, 15000);
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
